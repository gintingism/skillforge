[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge"
version = "0.1.0"
description = "Portable SKILL.md registry, adapters, CLI, and MCP server."
readme = "README.md"
license = "MIT"
authors = [
    { name = "gintingism", email = "gintingism@users.noreply.github.com" },
]
keywords = ["skills", "mcp", "copilot", "claude", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
skillforge = "skillforge.cli:app"

[project.urls]
Homepage = "https://github.com/gintingism/skillforge"
Repository = "https://github.com/gintingism/skillforge"
Issues = "https://github.com/gintingism/skillforge/issues"
Documentation = "https://gintingism.github.io/skillforge/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillforge = ["builtin_skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
packages = ["skillforge"]

[tool.coverage.report]
fail_under = 80
