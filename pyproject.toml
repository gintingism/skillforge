[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skillforge"
version = "0.2.0"
description = "Universal package manager, security auditor, and MCP server for portable agent skills (SKILL.md)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "gintingism", email = "gintingism@users.noreply.github.com" },
]
keywords = [
    "agent-skills",
    "skills",
    "agentskills",
    "mcp",
    "claude-code",
    "cursor",
    "antigravity",
    "windsurf",
    "security-audit",
    "prompt-injection",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "twine>=5.0",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
skillforge = "skillforge.cli:app"

[project.urls]
Homepage = "https://github.com/gintingism/skillforge"
Repository = "https://github.com/gintingism/skillforge"
Issues = "https://github.com/gintingism/skillforge/issues"
Documentation = "https://gintingism.github.io/skillforge/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillforge = [
    "builtin_skills/*/SKILL.md",
    "builtin_skills/*/*",
    "builtin_skills/*/*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
packages = ["skillforge"]
