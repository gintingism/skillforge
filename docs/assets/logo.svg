<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="70%" stop-color="#070a10" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#111c30" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <!-- Anvil Metal Top Gradient -->
    <linearGradient id="anvilTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Anvil Body Gradient -->
    <linearGradient id="anvilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Core Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Forge Ember Spark -->
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGlow)" rx="48" />

  <!-- Subtle Precision Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800" />
    <line x1="320" y1="0" x2="320" y2="800" />
    <line x1="480" y1="0" x2="480" y2="800" />
    <line x1="640" y1="0" x2="640" y2="800" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="480" x2="800" y2="480" />
    <line x1="0" y1="640" x2="800" y2="640" />
  </g>

  <!-- Outer Security Shield (Beveled Hexagonal Shield) -->
  <g id="shield-structure">
    <!-- Outer Shield Ambient Glow -->
    <polygon points="400,105 605,200 605,395 400,565 195,395 195,200"
             fill="none" stroke="#0284c7" stroke-width="8" opacity="0.25" filter="url(#glowFilter)" />

    <!-- Outer Shield Body -->
    <polygon points="400,110 600,205 600,390 400,560 200,390 200,205"
             fill="url(#shieldFill)" stroke="url(#shieldBorder)" stroke-width="4" stroke-linejoin="round" />

    <!-- Inner Shield Inset Line -->
    <polygon points="400,132 580,217 580,378 400,532 220,378 220,217"
             fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />
  </g>

  <!-- Central Forge Anvil (Faceted Geometric Architecture) -->
  <g id="anvil-core">
    <!-- Anvil Top Face (The Hardened Plate) -->
    <!-- Flat anvil horn pointing left, robust heel on right -->
    <polygon points="260,265 310,240 510,240 540,265 490,285 295,285"
             fill="url(#anvilTop)" />

    <!-- Anvil Face Highlight Edge -->
    <polyline points="260,265 310,240 510,240 540,265"
              fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />

    <!-- Anvil Waist (Faceted Tapered Center) -->
    <polygon points="295,285 490,285 450,370 335,370"
             fill="url(#anvilBody)" />

    <!-- Anvil Left Bevel Facet -->
    <polygon points="260,265 295,285 335,370 310,370"
             fill="#0369a1" opacity="0.7" />

    <!-- Anvil Right Bevel Facet -->
    <polygon points="540,265 490,285 450,370 475,370"
             fill="#082f49" opacity="0.8" />

    <!-- Anvil Base (Heavy Foundation) -->
    <polygon points="310,370 475,370 515,435 270,435"
             fill="url(#anvilTop)" />

    <!-- Anvil Base Bottom Shadow -->
    <polygon points="270,435 515,435 500,452 285,452"
             fill="#0f172a" />
  </g>

  <!-- Central Energy Core: The Agent Skill Spark -->
  <g id="skill-spark">
    <!-- Radial Ambient Pulse -->
    <circle cx="392" cy="328" r="75" fill="url(#sparkGlow)" opacity="0.85" />

    <!-- Multi-Point Precision Star / Node -->
    <!-- Core Diamond -->
    <polygon points="392,298 406,328 392,358 378,328"
             fill="url(#emberGrad)" filter="url(#glowFilter)" />
    <!-- Horizontal Points -->
    <polygon points="362,328 392,321 422,328 392,335"
             fill="url(#emberGrad)" filter="url(#glowFilter)" />

    <!-- Center White Hot Node -->
    <circle cx="392" cy="328" r="5" fill="#ffffff" />
  </g>

  <!-- Terminal Code Accent (< / > Angle Brackets in Base) -->
  <g id="code-accents" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Left Bracket < -->
    <polyline points="335,405 322,414 335,423" />
    <!-- Slash / -->
    <line x1="384" y1="424" x2="400" y2="404" />
    <!-- Right Bracket > -->
    <polyline points="449,405 462,414 449,423" />
  </g>

  <!-- Typography: SKILLFORGE -->
  <g id="logotype" text-anchor="middle">
    <!-- Main Title -->
    <text x="400" y="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
          font-size="46" font-weight="800" letter-spacing="8" fill="#f8fafc">
      SKILL<tspan fill="#38bdf8">FORGE</tspan>
    </text>

    <!-- Subtitle Tagline -->
    <text x="400" y="688" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
          font-size="13" font-weight="600" letter-spacing="4" fill="#94a3b8" opacity="0.9">
      UNIVERSAL AGENT SKILL RUNTIME
    </text>
  </g>
</svg>
