name: 'SkillForge Security & Token Linter'
description: 'Universal package manager, security auditor, and context token profiler for portable AI agent skills (SKILL.md).'
author: 'gintingism'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path to skill directory, package, or project root to audit'
    required: false
    default: '.'
  strict:
    description: 'Fail on any warning or low-severity finding'
    required: false
    default: 'false'
  doctor:
    description: 'Run comprehensive environment health and assistant diagnostics'
    required: false
    default: 'false'
  budget:
    description: 'Profile context token overhead and progressive disclosure limits'
    required: false
    default: 'false'
  sarif:
    description: 'Export audit findings as OASIS SARIF v2.1.0 for GitHub Code Scanning'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install SkillForge
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install agent-skillforge

    - name: Run SkillForge Audit
      shell: bash
      run: |
        STRICT_FLAG=""
        if [ "${{ inputs.strict }}" = "true" ]; then
          STRICT_FLAG="--strict"
        fi
        SARIF_FLAG=""
        if [ -n "${{ inputs.sarif }}" ]; then
          SARIF_FLAG="--sarif ${{ inputs.sarif }}"
        fi
        skillforge audit "${{ inputs.path }}" $STRICT_FLAG $SARIF_FLAG

    - name: Run SkillForge Doctor
      if: ${{ inputs.doctor == 'true' }}
      shell: bash
      run: |
        skillforge doctor --project "${{ inputs.path }}"

    - name: Run SkillForge Token Budget
      if: ${{ inputs.budget == 'true' }}
      shell: bash
      run: |
        skillforge budget --path "${{ inputs.path }}"
