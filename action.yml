name: 'SkillForge Security & Token Linter'
description: 'Universal package manager, security auditor, and context token profiler for portable AI agent skills (SKILL.md).'
author: 'gintingism'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path to skill directory, package, or project root to audit'
    required: false
    default: '.'
  strict:
    description: 'Fail on any warning or low-severity finding'
    required: false
    default: 'false'
  doctor:
    description: 'Run comprehensive environment health and assistant diagnostics'
    required: false
    default: 'false'
  budget:
    description: 'Profile context token overhead and progressive disclosure limits'
    required: false
    default: 'false'
  sarif:
    description: 'Export audit findings as OASIS SARIF v2.1.0 for GitHub Code Scanning'
    required: false
    default: ''
  policy:
    description: 'Optional path to .skillforge-policy.yaml policy gate file'
    required: false
    default: ''
  audit-mcp:
    description: 'Optional path to mcp.json configuration file to audit'
    required: false
    default: ''
  mcp-lock:
    description: 'Optional path to mcp-lock.json to verify against rug-pulls (MCP-008)'
    required: false
    default: ''
  sync-rules-check:
    description: 'Verify synchronized context rules against AGENTS.md (--check)'
    required: false
    default: 'false'
  lint-context:
    description: 'Lint project instruction files (AGENTS.md, CLAUDE.md, GEMINI.md, etc.)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install SkillForge
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install agent-skillforge

    - name: Run SkillForge Audit
      shell: bash
      run: |
        ARGS=("${{ inputs.path }}")
        if [ "${{ inputs.strict }}" = "true" ]; then
          ARGS+=("--strict")
        fi
        if [ -n "${{ inputs.policy }}" ]; then
          ARGS+=("--policy" "${{ inputs.policy }}")
        fi
        if [ -n "${{ inputs.sarif }}" ]; then
          ARGS+=("--sarif" "${{ inputs.sarif }}")
        fi
        skillforge audit "${ARGS[@]}"

    - name: Run SkillForge MCP Audit
      if: ${{ inputs.audit-mcp != '' }}
      shell: bash
      run: |
        MCP_ARGS=("${{ inputs.audit-mcp }}")
        if [ -n "${{ inputs.mcp-lock }}" ]; then
          MCP_ARGS+=("--verify-lock" "${{ inputs.mcp-lock }}")
        fi
        if [ "${{ inputs.strict }}" = "true" ]; then
          MCP_ARGS+=("--strict")
        fi
        skillforge audit-mcp "${MCP_ARGS[@]}"

    - name: Run Context Rule Drift Check
      if: ${{ inputs.sync-rules-check == 'true' }}
      shell: bash
      run: |
        skillforge sync-rules "${{ inputs.path }}" --check

    - name: Run Context File Linter
      if: ${{ inputs.lint-context == 'true' }}
      shell: bash
      run: |
        skillforge lint-context --project "${{ inputs.path }}"

    - name: Run SkillForge Doctor
      if: ${{ inputs.doctor == 'true' }}
      shell: bash
      run: |
        skillforge doctor --project "${{ inputs.path }}"

    - name: Run SkillForge Token Budget
      if: ${{ inputs.budget == 'true' }}
      shell: bash
      run: |
        skillforge budget --path "${{ inputs.path }}"
